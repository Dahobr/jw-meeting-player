<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media:; media-src 'self' media: data:;">
    <title>JW Meeting Player</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="app-container">
        <!-- Header: Navigation & System Controls -->
        <header class="app-header">
            <div class="menu-container">
                <button id="btn-menu" class="menu-btn">☰</button>
                <div id="header-menu" class="header-menu-dropdown">
                    <button id="btn-menu-tutorial" class="menu-item"><span class="menu-icon">🎓</span> Tutorial</button>
                    <button id="btn-menu-about" class="menu-item"><span class="menu-icon">ℹ️</span> Sobre</button>
                    <hr>
                    <button id="btn-menu-year" class="menu-item"><span class="menu-icon">🗓️</span> Texto do Ano</button>
                </div>
            </div>
            <div class="navigation-buttons">
                <button id="btn-reunioes" class="nav-icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="6" r="3"></circle>
                        <path d="M7 14.5c0-2 2-3.5 5-3.5s5 1.5 5 3.5V18H7v-3.5z"></path>
                        <path d="M5 18h14"></path>
                        <rect x="6" y="18" width="12" height="4"></rect>
                        <path d="M12 11v1.5"></path>
                    </svg>
                    <span>Reuniões</span>
                </button>
                <button id="btn-cantico" class="nav-icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                    <span>Cântico</span>
                </button>
                <button id="btn-videos" class="nav-icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                        <line x1="7" y1="2" x2="7" y2="22"></line>
                        <line x1="17" y1="2" x2="17" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <line x1="2" y1="7" x2="7" y2="7"></line>
                        <line x1="2" y1="17" x2="7" y2="17"></line>
                        <line x1="17" y1="17" x2="22" y2="17"></line>
                        <line x1="17" y1="7" x2="22" y2="7"></line>
                    </svg>
                    <span>Vídeos</span>
                </button>
                <button id="btn-esbocos" class="nav-icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Esboços</span>
                </button>
                <button id="btn-whatsapp" class="nav-icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.353-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.13.57-.074 1.758-.717 2.006-1.412.248-.695.248-1.29.173-1.412-.074-.122-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.886-9.886 9.886m8.415-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.149-1.613a11.815 11.815 0 005.895 1.573h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                    <span>WhatsApp</span>
                </button>
            </div>
            <div class="window-controls">
                <select id="zoom-mode-select" title="Modo de integração Zoom">
                    <option value="off">Zoom: Manual</option>
                    <option value="semi">Zoom: Semiautomático</option>
                    <option value="auto" selected>Zoom: Automático</option>
                </select>
            </div>
        </header>

        <!-- Main Content: Sidebar & WebView -->
        <main class="app-content">
            <aside class="playlist-manager">
                <div class="manager-content">
                    <!-- View 1: List of Playlists -->
                    <section id="view-playlists">
                        <div class="view-header">
                            <h2>Playlists</h2>
                            <div class="playlist-controls">
                                <input type="text" id="new-playlist-name" placeholder="Nova playlist...">
                                <button id="btn-create-playlist">+</button>
                            </div>
                        </div>
                        <div id="playlist-list">
                            <!-- Playlists will be rendered here -->
                        </div>
                    </section>

                    <!-- View 2: Items in Selected Playlist -->
                    <section id="view-items" style="display: none;">
                        <div class="view-header">
                            <button id="btn-back-to-playlists" title="Voltar">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            </button>
                            <h2 id="current-playlist-title">Nome da Playlist</h2>
                        </div>
                        <div id="current-playlist-items">
                            <ul id="playlist-items-ul">
                                <!-- Items will be rendered here -->
                            </ul>
                        </div>
                    </section>
                </div>
                
                <div class="footer-actions">
                    <button id="btn-import-file">Importar Arquivos</button>
                </div>
            </aside>

            <!-- WebView Area -->
            <section class="webview-container">
                <!-- WebContentsView (siteView) will be placed here by Main process -->
                <div id="help-view" class="help-overlay" style="display: none;">
                    <div class="help-content-wrapper">
                        <div id="help-html-container"></div>
                    </div>
                </div>
                <div id="preview-area" class="preview-overlay" style="display: none;">
                    <div id="preview-state-label" class="state-label"></div>
                    
                    <div class="preview-media-wrapper">
                        <video id="preview-video" muted></video>
                        <img id="preview-image" style="display: none;">
                    </div>
                    <div id="preview-controls-container" class="preview-controls">
                        <input type="range" id="preview-seeker" value="0" step="0.1">
                        <div class="preview-time-info">
                            <span id="preview-time-current">00:00</span> / <span id="preview-time-total">00:00</span>
                        </div>
                        <div id="preview-controls-overlay" class="preview-controls-overlay" style="display: none;"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <div class="playback-controls">
                <div class="misc-controls">
                    <span id="current-item-info">Nenhum item em reprodução</span>
                </div>

                <div class="transport-buttons">
                    <button id="btn-footer-prev" class="main-transport-btn nav-btn" title="Anterior">◀◀</button>
                    <button id="btn-footer-play-pause" class="main-transport-btn" title="Play/Pause">
                        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
                    </button>
                    <button id="btn-stop" class="main-transport-btn" title="Parar">
                        <svg width="24" height="24" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
                    </button>
                    <button id="btn-footer-next" class="main-transport-btn nav-btn" title="Próximo">▶▶</button>
                </div>

                <div class="app-version-info">
                    <span id="app-version">v0.0.0</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="custom-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="modal-message">Mensagem aqui</p>
            <div class="modal-actions">
                <button id="modal-cancel">Não</button>
                <button id="modal-confirm" class="btn-danger">Sim</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="Sortable.min.js"></script>
    <script src="js/domUtils.js"></script>
    <script src="js/viewRouter.js"></script>
    <script src="js/playlistStore.js"></script>
    <script src="js/ipcClient.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/playlistListRenderer.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/playbackManager.js"></script>
    <script src="js/eventHandler.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
