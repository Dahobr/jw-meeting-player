name: Submit Update to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Submit PR to WinGet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          # リリース情報がない場合(手動実行時)、最新リリースを取得
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              Write-Host "Manual trigger detected. Fetching latest release info..."
              $latestRelease = gh release view --json tagName,assets
              Write-Host "Raw latestRelease JSON: $latestRelease"
              $assetsJson = $latestRelease | ConvertFrom-Json | Select-Object -ExpandProperty assets | ConvertTo-Json -Compress
              Write-Host "Parsed assetsJson: $assetsJson"
              $version = (gh release view --json tagName --jq .tagName).TrimStart('v')
          } else {
              $assetsJson = '${{ toJSON(github.event.release.assets) }}'
              $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          }
          
          # JSONをPowerShellオブジェクトに変換
          $assets = $assetsJson | ConvertFrom-Json
          Write-Host "Assets found count: $($assets.Count)"
          $assets | ForEach-Object { Write-Host "Asset name: $($_.name)" }
          
          # インストール版アセット（Setupを含む）のみを選択
          $setupAsset = $assets | Where-Object { $_.name -like "*Setup*" } | Select-Object -First 1

          if (-not $setupAsset) {
              Write-Error "Setup asset not found!"
              exit 1
          }

          # URLプロパティの確認と取得
          # GitHub CLIのJSON出力で見えているのは "url" プロパティです
          $assetUrl = $setupAsset.url

          Write-Host "Using version: $version"
          Write-Host "Using asset: $($setupAsset.name)"
          Write-Host "Using URL: $assetUrl"

          # WinGetCreateのインストール
          winget install --id Microsoft.WingetCreate --accept-source-agreements --accept-package-agreements

          # 更新とPR送信
          wingetcreate update Dahobr.JWMeetingPlayer `
            --version $version `
            --urls "$assetUrl" `
            --architecture x64 `
            --token "$env:WINGET_GITHUB_TOKEN" `
            --submit
